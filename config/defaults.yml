# vps-harden — built-in defaults
#
# This file is the single source of truth for the *user-facing* configuration
# schema. Roles keep their own defaults (so they can be reused standalone), and
# tests/unit/test_config_contract.py fails if the two ever drift apart.
#
# Do not edit this file to customise your server: copy config/example.yml to
# config/vps-harden.yml and change values there. Your file is merged on top of
# these defaults.
---
vps_harden:
  # ---------------------------------------------------------------- general
  timezone: Etc/UTC
  log_dir: /var/log/vps-harden
  backup_dir: /var/backups/vps-harden
  reports_dir: /var/lib/vps-harden/reports

  # ---------------------------------------------------------------- ssh
  ssh:
    enabled: true
    port: 22
    # false = "PermitRootLogin no"; true = "yes"; "prohibit-password" = keys only
    permit_root_login: false
    password_authentication: false
    pubkey_authentication: true
    kbd_interactive_authentication: false
    max_auth_tries: 3
    login_grace_time: 30
    client_alive_interval: 300
    client_alive_count_max: 2
    x11_forwarding: false
    allow_tcp_forwarding: false
    allow_users: []
    allow_groups: []
    # Empty = auto-detect members of the sudo group (plus SUDO_USER).
    admin_users: []
    # Escape hatch: allow disabling password auth with zero authorized keys.
    # You almost never want this true.
    allow_no_keys: false

  # ---------------------------------------------------------------- ufw
  ufw:
    enabled: true
    default_incoming: deny
    default_outgoing: allow
    default_routed: deny
    # off | low | medium | high | full
    logging: low
    ipv6: true
    # Allow everything arriving on the tailscale0 interface (admin path).
    allow_tailscale: true
    # Derived rule: allow the configured SSH port from anywhere.
    auto_allow_ssh: true
    # Extra rules. Each entry:
    #   - rule: allow|deny|reject|limit
    #     port: "443"          # optional when interface/from is set
    #     proto: tcp|udp       # optional
    #     from: 10.0.0.0/8     # optional source
    #     interface: tailscale0
    #     comment: "HTTPS"
    extra_rules: []
    # If non-zero, schedules "ufw disable" after N minutes as a lockout
    # dead-man switch. Cancel with: sudo install.sh firewall cancel-deadman
    deadman_minutes: 0
    # Docker publishes bypass UFW's INPUT chain. Enabling this writes an
    # explicit DOCKER-USER policy into /etc/ufw/after.rules.
    manage_docker_user_chain: false
    # Ports that stay reachable from the internet when the chain is managed.
    docker_allowed_ports: []

  # ---------------------------------------------------------------- fail2ban
  fail2ban:
    enabled: true
    backend: systemd
    maxretry: 5
    findtime: 10m
    bantime: 1h
    bantime_increment: true
    bantime_factor: 2
    bantime_maxtime: 4w
    # Never banned. Loopback and the Tailscale CGNAT ranges are always added
    # by the role; anything here is on top of that.
    ignoreip: []
    # What to do when another jail.d file already configures [sshd]:
    #   fail  = refuse and tell the operator (default, safest)
    #   adopt = rename the file to *.pre-vps-harden.bak (recoverable)
    #   ignore = leave it alone; our file may be overridden. Audited as WARN.
    conflict_policy: fail

  # ---------------------------------------------------------------- crowdsec
  crowdsec:
    enabled: true
    # Set false on hosts that already have the CrowdSec apt repository.
    manage_repo: true
    collections:
      - crowdsecurity/linux
      - crowdsecurity/sshd
    # auto = file when /var/log/auth.log exists, journalctl otherwise
    acquisition: auto
    # 8080 is frequently published by a container on Docker hosts; CrowdSec
    # then restart-loops with "address already in use".
    lapi_port: 8081
    manage_lapi_port: true
    # Detection is always on; enforcement is opt-in.
    firewall_bouncer_enabled: false
    bouncer_conflict_policy: fail
    whitelist_tailnet: true

  # ------------------------------------------------------- unattended upgrades
  unattended_upgrades:
    enabled: true
    automatic_reboot: false
    reboot_time: "03:00"
    remove_unused_dependencies: true
    email: ""
    origins:
      - security

  # ---------------------------------------------------------------- tailscale
  tailscale:
    enabled: false
    manage_repo: true
    # Enable Tailscale SSH (tailnet-only, ACL controlled). Off by default.
    ssh: false
    accept_routes: false
    advertise_exit_node: false

  # ---------------------------------------------------------------- docker
  docker:
    enabled: false
    manage_repo: true
    log_max_size: 10m
    log_max_file: "3"
    live_restore: true
    no_new_privileges: true

  # ---------------------------------------------------------------- hermes
  hermes:
    enabled: false
    # Register the read-only vps-harden MCP server with Hermes.
    register_mcp: false
    gateway_service: hermes-gateway.service

  # ---------------------------------------------------------------- monitoring
  monitoring:
    enabled: false
    bind_address: 127.0.0.1
    grafana_port: 3030
    prometheus_port: 9090

  # ---------------------------------------------------------------- logging
  logging:
    enabled: false
    manage_journald: true
    journald_max_use: 500M
    journald_retention: 30d
    # Optional Loki + Promtail stack next to Grafana. Off: journalctl is enough
    # for a single VPS, and every extra container is extra attack surface.
    loki_enabled: false
    loki_port: 3100

  # ---------------------------------------------------------------- backup
  backup:
    enabled: false
    schedule: "*-*-* 03:30:00"
    local_repo: /var/backups/vps-harden/restic
    paths:
      - /etc
      - /opt/homelab
    # Never back up credentials or API tokens.
    exclude:
      - /etc/crowdsec/local_api_credentials.yaml
      - /root/.hermes/.env
    keep_daily: 7
    keep_weekly: 4
    keep_monthly: 3

  # ---------------------------------------------------------------- audit
  audit:
    fail_on: fail
    include_docker: true
