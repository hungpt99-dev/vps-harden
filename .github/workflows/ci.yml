---
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  ANSIBLE_CORE: "2.17.14"
  ANSIBLE_LINT: "26.6.0"
  BATS_VERSION: "1.11.1"

jobs:
  lint:
    name: Lint (shellcheck, ansible-lint, syntax)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${ANSIBLE_CORE}" "ansible-lint==${ANSIBLE_LINT}"

      - name: ShellCheck
        run: shellcheck -x install.sh uninstall.sh scripts/*.sh tests/integration/run.sh

      - name: Ansible syntax check
        run: |
          for playbook in playbooks/*.yml; do
            ansible-playbook --syntax-check "$playbook"
          done

      - name: Ansible Lint
        run: ansible-lint roles/ playbooks/

      - name: Validate the shipped example configuration
        run: python3 scripts/validate_config.py --defaults config/defaults.yml --user config/example.yml

  unit:
    name: Unit tests (bats + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Bats and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq
          git clone --depth 1 --branch "v${BATS_VERSION}" \
            https://github.com/bats-core/bats-core.git /tmp/bats-core
          sudo /tmp/bats-core/install.sh /usr/local
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${ANSIBLE_CORE}" pytest

      - name: Python tests
        run: python -m pytest tests/unit -q

      - name: Bats tests
        run: bats tests/unit/*.bats

      - name: Configuration contract
        run: python -m pytest tests/unit/test_config_contract.py -q

  integration:
    name: Integration (Ubuntu 24.04 container)
    runs-on: ubuntu-24.04
    needs: [unit]
    steps:
      - uses: actions/checkout@v4

      # The container is disposable and privileged only inside the runner.
      # No firewall or SSH configuration on the runner itself is touched.
      - name: Run integration suite
        run: ./tests/integration/run.sh

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs
          path: |
            reports/integration-*
          retention-days: 7

  molecule:
    name: Molecule (baseline role idempotence)
    runs-on: ubuntu-24.04
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Molecule and its docker driver
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ansible-core==${ANSIBLE_CORE}" \
            "molecule==25.11.0" "molecule-plugins[docker]==25.8.12"

      # A privileged container with systemd is required: the role manages units.
      - name: Run the scenario (includes the idempotence step)
        run: cd tests && molecule test

  compatibility:
    name: Role syntax on supported Ubuntu releases
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:22.04", "ubuntu:24.04"]
    steps:
      - uses: actions/checkout@v4

      - name: Check playbook syntax against ${{ matrix.image }} facts
        run: |
          docker run --rm -v "$PWD:/repo:ro" -w /repo "${{ matrix.image }}" \
            bash -c '
              apt-get update -qq &&
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq python3 python3-yaml ansible-core >/dev/null &&
              ansible-playbook -i inventory/localhost.yml playbooks/site.yml --syntax-check
            '
