---
- name: Enable and start tailscaled
  ansible.builtin.systemd:
    name: tailscaled
    enabled: true
    state: started

- name: Read the Tailscale backend state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status
  changed_when: false
  failed_when: false
  check_mode: false

- name: Parse the backend state
  ansible.builtin.set_fact:
    tailscale_backend_state: >-
      {{ (tailscale_status.stdout | from_json).BackendState
         if tailscale_status.stdout | default('') | length > 0
         else 'Unknown' }}

- name: Connect to the tailnet with a vault-supplied auth key
  ansible.builtin.command:
    argv: >-
      {{ ['tailscale', 'up', '--authkey', tailscale_auth_key]
         + (['--ssh'] if tailscale_ssh | bool else [])
         + (['--accept-routes'] if tailscale_accept_routes | bool else [])
         + (['--advertise-exit-node'] if tailscale_advertise_exit_node | bool else [])
         + (['--hostname', tailscale_hostname] if tailscale_hostname | length > 0 else []) }}
  no_log: true
  changed_when: true
  when:
    - tailscale_auth_key | length > 0
    - tailscale_backend_state != 'Running'

- name: Explain how to authenticate without an auth key
  ansible.builtin.debug:
    msg: >-
      Tailscale is installed and tailscaled is running, but this node is not
      authenticated (BackendState={{ tailscale_backend_state }}).
      Run `sudo tailscale up` and open the printed URL, or supply
      tailscale_auth_key from Ansible Vault. vps-harden never generates
      reusable auth keys for you.
  when:
    - tailscale_auth_key | length == 0
    - tailscale_backend_state != 'Running'

- name: Re-read the backend state
  ansible.builtin.command:
    argv: [tailscale, status, --json]
  register: tailscale_status_after
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - tailscale_auth_key | length > 0
    - not ansible_check_mode

- name: Verify the node joined the tailnet
  ansible.builtin.assert:
    that:
      - "(tailscale_status_after.stdout | from_json).BackendState == 'Running'"
    fail_msg: >-
      Tailscale did not reach BackendState=Running. Check
      `journalctl -u tailscaled -n 50` and `tailscale status`.
    quiet: true
  when:
    - tailscale_auth_key | length > 0
    - not ansible_check_mode
