---
tailscale_enabled: false
tailscale_manage_repo: true
tailscale_ssh: false
tailscale_accept_routes: false
tailscale_advertise_exit_node: false
tailscale_hostname: ""

# Never put an auth key in config/vps-harden.yml. Supply it as an extra var from
# Ansible Vault (`--vault-id ... -e tailscale_auth_key=...`) for a headless
# first login; otherwise run `sudo tailscale up` interactively.
tailscale_auth_key: ""
tailscale_release: "{{ ansible_distribution_release }}"
tailscale_key_url: "https://pkgs.tailscale.com/stable/ubuntu/{{ ansible_distribution_release }}.noarmor.gpg"
tailscale_repo_line: >-
  deb [signed-by=/usr/share/keyrings/tailscale-archive-keyring.gpg]
  https://pkgs.tailscale.com/stable/ubuntu {{ ansible_distribution_release }} main
tailscale_keyring: /usr/share/keyrings/tailscale-archive-keyring.gpg
